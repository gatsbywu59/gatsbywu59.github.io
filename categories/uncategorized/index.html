<!-- 图片灯箱：点击放大 + 滚轮翻图 + 左右键翻图 + ESC关闭 -->
<style>
#lightbox-box {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  cursor: zoom-out;
}
#lightbox-box img {
  max-width: 92%;
  max-height: 92%;
  object-fit: contain;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 灯箱容器
  const lightbox = document.createElement('div');
  lightbox.id = 'lightbox-box';
  lightbox.innerHTML = '<img src="">';
  document.body.appendChild(lightbox);

  // 获取文章所有图片（Cactus 专用）
  const imgs = document.querySelectorAll('.post img');
  let imgList = [];
  let currentIndex = 0;

  // 存入图片列表
  imgs.forEach((img, idx) => {
    imgList.push(img.src);
    img.style.cursor = 'zoom-in';
    // 点击打开大图
    img.onclick = function(e) {
      e.preventDefault();
      currentIndex = idx;
      lightbox.querySelector('img').src = imgList[currentIndex];
      lightbox.style.display = 'flex';
    };
  });

  // 点击遮罩关闭
  lightbox.onclick = function(e) {
    if (e.target === lightbox) {
      lightbox.style.display = 'none';
    }
  };

  // 上一张
  function prevImg() {
    currentIndex = (currentIndex - 1 + imgList.length) % imgList.length;
    lightbox.querySelector('img').src = imgList[currentIndex];
  }
  // 下一张
  function nextImg() {
    currentIndex = (currentIndex + 1) % imgList.length;
    lightbox.querySelector('img').src = imgList[currentIndex];
  }

  // 鼠标滚轮切换
  lightbox.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (e.deltaY > 0) {
      nextImg();
    } else {
      prevImg();
    }
  });

  // 键盘左右箭头、ESC关闭
  document.addEventListener('keydown', function(e) {
    if (lightbox.style.display !== 'flex') return;
    switch(e.key) {
      case 'ArrowLeft':
        prevImg();
        break;
      case 'ArrowRight':
        nextImg();
        break;
      case 'Escape':
        lightbox.style.display = 'none';
        break;
    }
  });
});
</script>

/* 描述文字：从上往下淡入动画 */

/* 动画定义：从上淡入 */
@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-20px); /* 从上方 20px 开始 */
  }
  to {
    opacity: 1;
    opacity: 1;
    transform: translateY(0); /* 回到原位 */
  }
}
